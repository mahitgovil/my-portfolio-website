<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mahit Govil</title>
    <meta
      name="description"
      content="Mahit Govil, software engineer. Web apps in React and FastAPI, and the systems underneath: a search engine in C++, a shell and peer-to-peer transfer."
    />
    <meta name="theme-color" content="#04060b" />
    <!-- the saved theme, before the first paint (components/theme.js) -->
    <script>
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').content = "#e9eef5";
        }
      } catch (e) {}
    </script>

    <!-- Fonts: connect early and load with <link> (the old CSS @import only started
         after the main CSS file had been downloaded and parsed) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/favicon-16x16.png"
    />
    <link rel="manifest" href="./assets/site.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <!-- Static hero "shell": painted as soon as the CSS is ready, without waiting for the
         JS bundle. React replaces everything inside #root when it mounts, and the real hero
         (Hero.jsx) looks identical, so there is no visible jump.
         Keep the text in sync with Hero.jsx. -->
    <div id="root">
      <section class="bgimage">
      <div class="hero-bg"></div>
      <!-- hidden until the intro reveals it (see hero.css); here so the text is in the HTML -->
      <div class="hero">
        <div class="container hero__inner">
          <h1 class="hero__title">
            <span class="hero__hi hero__reveal">Hi! I'm </span>
            <span class="hero__name">
              <span class="hero__first">Mahit</span>
              <span class="hero__last">Govil</span>
            </span>
          </h1>
          <p class="hero__lead hero__reveal">
            Every click starts a journey. I build both ends of it, and the road
            between.
          </p>
        </div>
      </div>
      </section>
    </div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
